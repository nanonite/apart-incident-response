services:
  qwen3:
    build:
      context: .
      dockerfile: Dockerfile.qwen3
    image: apart-qwen3-logits:local
    working_dir: /workspace
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      PYTHONPATH: /workspace/src
    volumes:
      - type: bind
        source: ${QWEN3_CACHE_DIR:-./qwen3-cache}
        target: /models/huggingface
      - type: bind
        source: ./runs/qwen3-8b
        target: /workspace/runs/qwen3-8b
    gpus: all
