services:
  runtime:
    image: apart-incident-response:local
    build:
      context: .
      target: runtime
    environment:
      APART_PI_ROOT: /opt/pi
      APART_PI_AUTH_FILE: /run/secrets/pi-auth.json
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
    # bubblewrap creates the inner agent namespaces. The agent still receives
    # only the read-only paths explicitly assembled by the Python controller.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command: ["validate-config", "config/runtime.json"]

  # Local model for the one-shot /goal logprobs data path. Serves Qwen3-8B
  # (4-bit) and exposes token-level logprobs via /api/generate so the entropy
  # metrics in entropy-metrics-mvp.md can be computed from raw probabilities.
  ollama:
    image: ollama/ollama:0.34.0
    # Requires the NVIDIA Container Toolkit on the host. On a CPU-only host,
    # drop `gpus: all` and Ollama will fall back to CPU inference.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ./ollama-models
        target: /root/.ollama
    ports:
      - "11434:11434"
