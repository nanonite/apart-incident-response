services:
  runtime:
    image: apart-incident-response:local
    build:
      context: .
      target: runtime
    environment:
      APART_PI_ROOT: /opt/pi
      APART_PI_AUTH_FILE: /run/secrets/pi-auth.json
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
    # bubblewrap creates the inner agent namespaces. The agent still receives
    # only the read-only paths explicitly assembled by the Python controller.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command: ["validate-config", "config/runtime.json"]

  # The trusted outer controller path. This service is deliberately separate
  # and opt-in; it does not change the default `runtime` service, which only
  # validates configuration. Other hosts can use the repository normally.
  # Credentials are supplied as one-off read-only mounts by the Just targets;
  # the Pi child never receives the Docker socket or the source credential.
  matrix:
    image: apart-incident-response:local
    build:
      context: .
      target: runtime
    environment:
      APART_CONTAINERIZED: "1"
      APART_PI_ROOT: /opt/pi
      APART_PI_AUTH_FILE: /run/secrets/pi-auth.json
      APART_PI_AUTH_STORE: /controller-state/codex-auth.json
      APART_OPENCODE_API_KEY_FILE: /run/secrets/opencode-key
    volumes:
      - type: bind
        source: ./runs
        target: /app/runs
      - type: volume
        source: controller-auth-state
        target: /controller-state
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/app/scripts/container_matrix_entrypoint.sh"]
    command: ["--harness-check", "--output", "/app/runs/container-harness"]

  # Local model for the one-shot /goal logprobs data path. Serves Qwen3-8B
  # (4-bit) and exposes token-level logprobs via /api/generate so the entropy
  # metrics in entropy-metrics-mvp.md can be computed from raw probabilities.
  ollama:
    image: ollama/ollama:0.34.0
    # Requires the NVIDIA Container Toolkit on the host. On a CPU-only host,
    # drop `gpus: all` and Ollama will fall back to CPU inference.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ./ollama-models
        target: /root/.ollama
    ports:
      - "11434:11434"

volumes:
  # Persistent controller-only OAuth refresh state. It is not part of the
  # image, repository, agent workspace, or Pi Bubblewrap mounts.
  controller-auth-state:
    name: apart-incident-response-controller-auth-state
